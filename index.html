<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123c69">
  <title>1500m ラップ測定</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root{
      --bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#657089;
      --line:#dbe2ea;--main:#123c69;--main2:#1e5b93;--ok:#166534;
      --danger:#b42318;--shadow:0 10px 30px rgba(18,60,105,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
    button,input,textarea{font:inherit}
    .wrap{max-width:720px;margin:auto;padding:16px 14px 40px}
    h1{font-size:1.35rem;margin:4px 0 14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
    .label{display:block;font-size:.9rem;font-weight:700;margin-bottom:7px}
    .input,.textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;color:var(--text);font-size:16px}
    .textarea{min-height:92px;resize:vertical}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .timer{text-align:center;font-variant-numeric:tabular-nums;font-size:3.2rem;font-weight:800;letter-spacing:-.04em;margin:2px 0 6px}
    .sub{text-align:center;color:var(--muted);font-size:.9rem}
    .btn{width:100%;min-height:56px;border:0;border-radius:14px;font-weight:800;font-size:1.05rem;cursor:pointer}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .primary{background:var(--main);color:white}
    .lap{background:#fff;color:var(--main);border:2px solid var(--main)}
    .copy{background:var(--main2);color:white}
    .ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
    .lap.big{min-height:76px;font-size:1.25rem}
    table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
    th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right}
    th:first-child,td:first-child{text-align:left}
    .total{font-size:1.5rem;font-weight:800}
    .output{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.7;font-size:.95rem}
    .status{min-height:24px;text-align:center;color:var(--ok);font-weight:700;margin-top:8px}
    .hidden{display:none}
    .saved{font-size:.82rem;color:var(--muted);margin-top:8px}
    .badge{display:inline-block;border-radius:999px;padding:4px 9px;background:#edf4fb;color:var(--main);font-size:.78rem;font-weight:700}
    @media(max-width:480px){.grid{grid-template-columns:1fr}.timer{font-size:2.75rem}}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>1500m ラップ測定</h1>

    <section class="card">
      <label class="label" for="target">目標タイム</label>
      <input id="target" class="input" inputmode="numeric" placeholder="例：5:40">
      <div class="saved">入力内容と測定記録は、この端末に自動保存されます。</div>
    </section>

    <section class="card">
      <div class="sub">トータルタイム</div>
      <div id="timer" class="timer">0:00.0</div>
      <div id="distance" class="sub">0 / 1500m</div>
      <div id="next" class="sub" style="margin-top:6px">スタート前</div>
    </section>

    <div class="grid" style="margin-bottom:14px">
      <button id="startBtn" class="btn primary" type="button">スタート</button>
      <button id="lapBtn" class="btn lap big" type="button" disabled>300m 通過</button>
    </div>

    <section class="card">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px">
        <strong>1周ごとのラップ</strong>
        <span class="badge">300m × 5周</span>
      </div>
      <table>
        <thead><tr><th>距離</th><th>ラップ</th><th>累計</th></tr></thead>
        <tbody id="lapRows"><tr><td colspan="3" style="text-align:center;color:var(--muted)">まだ記録はありません</td></tr></tbody>
      </table>
    </section>

    <section id="finishCard" class="card hidden">
      <div class="sub" style="text-align:left">1500m記録</div>
      <div id="finalTime" class="total"></div>

      <label class="label" for="reflection" style="margin-top:16px">走った感覚・振り返り</label>
      <textarea id="reflection" class="textarea" placeholder="例：後半かなりきつかった"></textarea>

      <div style="margin-top:16px;font-weight:800">スクールAI貼り付け用</div>
      <div id="output" class="output" aria-live="polite"></div>

      <button id="copyBtn" class="btn copy" type="button" style="margin-top:12px">文章をコピー</button>
      <div id="copyStatus" class="status" aria-live="polite"></div>
    </section>

    <button id="resetBtn" class="btn ghost" type="button">新しく測定する</button>
  </main>

<script>
(() => {
  const KEY = "lap1500_v1";
  const $ = id => document.getElementById(id);
  const target = $("target"), timer = $("timer"), distance = $("distance"), next = $("next");
  const startBtn = $("startBtn"), lapBtn = $("lapBtn"), lapRows = $("lapRows");
  const finishCard = $("finishCard"), finalTime = $("finalTime"), reflection = $("reflection");
  const output = $("output"), copyBtn = $("copyBtn"), copyStatus = $("copyStatus"), resetBtn = $("resetBtn");

  let state = { target:"", started:false, startEpoch:0, laps:[], reflection:"" };
  let raf = null;

  const safeParse = raw => {
    try { return Object.assign({target:"",started:false,startEpoch:0,laps:[],reflection:""}, JSON.parse(raw||"{}")); }
    catch { return {target:"",started:false,startEpoch:0,laps:[],reflection:""}; }
  };
  const save = () => localStorage.setItem(KEY, JSON.stringify(state));
  const totalMs = () => state.laps.length ? state.laps[state.laps.length-1] : Math.max(0, Date.now()-state.startEpoch);

  function fmtClock(ms, tenth=false){
    ms=Math.max(0,ms||0);
    const sec=Math.floor(ms/1000), m=Math.floor(sec/60), s=sec%60;
    if(tenth) return m+":"+String(s).padStart(2,"0")+"."+Math.floor((ms%1000)/100);
    return m+":"+String(s).padStart(2,"0");
  }
  function fmtJapanese(ms){
    const sec=Math.round(Math.max(0,ms||0)/1000);
    return Math.floor(sec/60)+"分"+String(sec%60).padStart(2,"0")+"秒";
  }
  function lapSec(i){
    const prev=i===0?0:state.laps[i-1];
    return Math.round((state.laps[i]-prev)/1000);
  }
  function targetDisplay(){
    const v=(state.target||"").trim();
    if(!v) return "未入力";
    const m=v.match(/^(\d{1,2})\s*[:：]\s*(\d{1,2})$/);
    if(m) return Number(m[1])+"分"+String(Number(m[2])).padStart(2,"0")+"秒";
    return v;
  }
  function makeText(){
    if(state.laps.length!==5) return "";
    const lines=[
      "1500m記録："+fmtJapanese(state.laps[4]),
      "目標："+targetDisplay(),
      "300m："+lapSec(0)+"秒",
      "600m："+lapSec(1)+"秒",
      "900m："+lapSec(2)+"秒",
      "1200m："+lapSec(3)+"秒",
      "1500m："+lapSec(4)+"秒",
      "前回の感覚："+((state.reflection||"").trim()||"未入力")
    ];
    return lines.join("\n");
  }
  function renderRows(){
    if(!state.laps.length){
      lapRows.innerHTML='<tr><td colspan="3" style="text-align:center;color:var(--muted)">まだ記録はありません</td></tr>';
      return;
    }
    lapRows.innerHTML="";
    state.laps.forEach((ms,i)=>{
      const tr=document.createElement("tr");
      tr.innerHTML="<td>"+((i+1)*300)+"m</td><td><strong>"+lapSec(i)+"秒</strong></td><td>"+fmtClock(ms)+"</td>";
      lapRows.appendChild(tr);
    });
  }
  function render(){
    target.value=state.target||"";
    reflection.value=state.reflection||"";
    renderRows();
    const d=state.laps.length*300;
    distance.textContent=d+" / 1500m";
    if(state.laps.length===5){
      timer.textContent=fmtClock(state.laps[4],true);
      next.textContent="測定終了";
      finalTime.textContent=fmtJapanese(state.laps[4]);
      finishCard.classList.remove("hidden");
      output.textContent=makeText();
      startBtn.disabled=true; lapBtn.disabled=true;
    }else{
      finishCard.classList.add("hidden");
      startBtn.disabled=state.started;
      lapBtn.disabled=!state.started;
      const nextM=(state.laps.length+1)*300;
      lapBtn.textContent=nextM+"m 通過";
      next.textContent=state.started?"次は "+nextM+"m":"スタート前";
    }
  }
  function tick(){
    if(!state.started || state.laps.length===5) return;
    timer.textContent=fmtClock(Date.now()-state.startEpoch,true);
    raf=requestAnimationFrame(tick);
  }

  target.addEventListener("input",()=>{ state.target=target.value; save(); if(state.laps.length===5) output.textContent=makeText(); });
  reflection.addEventListener("input",()=>{ state.reflection=reflection.value; save(); output.textContent=makeText(); copyStatus.textContent=""; });

  startBtn.addEventListener("click",()=>{
    if(state.started || state.laps.length) return;
    state.started=true; state.startEpoch=Date.now(); state.laps=[]; copyStatus.textContent="";
    save(); render(); tick();
  });

  lapBtn.addEventListener("click",()=>{
    if(!state.started) return;
    const elapsed=Date.now()-state.startEpoch;
    state.laps.push(elapsed);
    if(state.laps.length>=5){
      state.started=false;
      if(raf) cancelAnimationFrame(raf);
    }
    save(); render();
    if(state.started) tick();
  });

  copyBtn.addEventListener("click",async()=>{
    const text=makeText();
    if(!text) return;
    let ok=false;
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text); ok=true;
      }
    }catch{}
    if(!ok){
      const ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ ok=document.execCommand("copy"); }catch{}
      ta.remove();
    }
    copyStatus.textContent=ok?"コピーしました！":"コピーできませんでした。文章を長押ししてコピーしてください。";
  });

  resetBtn.addEventListener("click",()=>{
    if(state.started && !confirm("測定中です。最初からやり直しますか？")) return;
    if(!state.started && state.laps.length && !confirm("今の記録を消して新しく測定しますか？")) return;
    if(raf) cancelAnimationFrame(raf);
    state={target:state.target||"",started:false,startEpoch:0,laps:[],reflection:""};
    timer.textContent="0:00.0"; copyStatus.textContent="";
    save(); render();
  });

  state=safeParse(localStorage.getItem(KEY));
  if(state.started && state.startEpoch>0 && state.laps.length<5){
    render(); tick();
  }else{
    state.started=false; save(); render();
  }

  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
})();
</script>
</body>
</html>
